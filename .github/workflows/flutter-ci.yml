name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bootstrap and verify Flutter project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Generate Android and iOS project scaffold when missing
        id: bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            cp README.md "$RUNNER_TEMP/README.md"
            flutter create --empty --platforms=android,ios --org com.example --project-name mobile_starter_kit .
            cp "$RUNNER_TEMP/README.md" README.md
            mkdir -p test
            cat > test/app_smoke_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mobile_starter_kit/main.dart';

          void main() {
            testWidgets('renders the starter application', (tester) async {
              await tester.pumpWidget(const MainApp());

              expect(find.text('Hello World!'), findsOneWidget);
            });
          }
          EOF
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit generated scaffold
        if: steps.bootstrap.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: bootstrap Flutter Android and iOS project"
          git push
